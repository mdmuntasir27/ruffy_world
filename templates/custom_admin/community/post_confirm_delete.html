{% extends 'custom_admin/base_admin.html' %}
{% block page_title %}Delete Community Post{% endblock %}

{% block content %}
<div style="max-width:550px; margin:2rem auto;">
    <div class="card" style="border-color:#fca5a5;">
        <div class="card-header" style="background:#fee2e2; color:#991b1b;">
            ⚠️ Delete Community Post
        </div>
        <div class="card-body">
            <p style="font-size:1.05rem; margin-bottom:1rem;">
                Are you sure you want to delete the post for <strong>"{{ post.pet_name }}"</strong> posted by <strong>{{ post.author.username }}</strong>?
            </p>
            <form method="post" style="display:flex; justify-content:flex-end; gap:0.75rem;">
                {% csrf_token %}
                <a href="{% url 'custom_admin:community_post_list' %}" class="btn btn-outline" style="color:var(--text); border-color:var(--border);">Cancel</a>
                <button type="submit" class="btn btn-danger">Yes, Delete Post</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
