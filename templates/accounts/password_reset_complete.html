{% extends 'base.html' %}
{% block title %}Password Reset Complete - Ruffy World{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align:center;">
    <div style="font-size:3rem; margin-bottom:1rem;">✅</div>
    <h2>Password Changed!</h2>
    <p class="auth-subtitle">Your password has been successfully reset. You can now log in with your new password.</p>
    <a href="/accounts/login/" class="btn btn-primary btn-block mt-2">Log In</a>
  </div>
</div>
{% endblock %}
