{% extends 'base.html' %}
{% block title %}Forgot Password - Ruffy World{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>🔐 Forgot Password?</h2>
    <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="post" class="form-stack">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <p style="text-align:center; margin-top:1rem; font-size:0.875rem; color:var(--text-muted);">
      Remembered it? <a href="/accounts/login/" style="color:var(--primary-light);">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
